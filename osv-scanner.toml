# osv-scanner suppressions.
#
# Two groups, both deliberate. grype and trivy already skip test/fixtures via
# .grype.yaml and REPOSITORY_TRIVY_ARGUMENTS; osv-scanner never got the same
# treatment, which is why it was the only scanner failing on them.

# --- Group 1: test fixtures -------------------------------------------------
# test/fixtures/* are sample lockfiles pinned to old versions on purpose, so the
# parsers have something realistic to parse. Nothing here is installed or
# executed; bumping them would defeat the fixtures' purpose.

