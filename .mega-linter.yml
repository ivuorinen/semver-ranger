# https://megalinter.io/configuration/

APPLY_FIXES: all
FILEIO_REPORTER: false
GITHUB_STATUS_REPORTER: true
IGNORE_GENERATED_FILES: true
PARALLEL: true
PRINT_ALPACA: false
SARIF_REPORTER: true
SHOW_ELAPSED_TIME: false
SHOW_SKIPPED_LINTERS: false

DISABLE_LINTERS:
  - JAVASCRIPT_ES
  - JAVASCRIPT_STANDARD
  - REPOSITORY_DEVSKIM
  - REPOSITORY_KINGFISHER
  - SPELL_CSPELL
  - SPELL_LYCHEE
  - TYPESCRIPT_ES
  - TYPESCRIPT_STANDARD

# Skip test fixtures — they intentionally use old package versions for parser tests
REPOSITORY_TRIVY_ARGUMENTS: --skip-dirs test/fixtures

# Skip files with no registered JSON Schema to avoid false v8r failures
YAML_V8R_FILTER_REGEX_EXCLUDE: (\.grype\.yaml|test/fixtures)

# MegaLinter runs markdownlint through markdownlint-cli, which reads a flat
# rule config — not a markdownlint-cli2 wrapper. Keep this pointed at the same
# file `npm run lint:md` uses so local and CI results agree.
MARKDOWN_MARKDOWNLINT_CONFIG_FILE: .markdownlint.json

# CHANGELOG.md is regenerated by semantic-release with its own heading layout.
MARKDOWN_FILTER_REGEX_EXCLUDE: (CHANGELOG\.md)

FILTER_REGEX_EXCLUDE: (node_modules|\.git)
