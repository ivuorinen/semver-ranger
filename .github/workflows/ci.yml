---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}

permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes; keep the token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          # Caches ~/.npm. A node_modules cache is useless here: npm ci deletes
          # node_modules before installing.
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run cov

      # Node's coverage merge can drop a never-taken branch once a CLI test's
      # child process runs the block around it, so the gate above passes.
      - run: node .github/scripts/coverage-merge-guard.mjs

      - run: npm run build

      # `files` in package.json allowlists dist/. This fails when it is widened,
      # or when the tarball would ship without the CLI.
      - run: node .github/scripts/pack-check.mjs

      # Publish only runs on main, so without this a release-tooling bump
      # merges green and breaks the next release (Publish run 34754580307).
      - run: node .github/scripts/release-notes-smoke.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
