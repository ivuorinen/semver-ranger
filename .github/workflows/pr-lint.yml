---
name: PR Lint

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Read-only: the linters run code from the node_modules this PR installed,
    # so nothing in this job may hold a token that can push, comment or post
    # statuses. MegaLinter only reports (APPLY_FIXES: none in .mega-linter.yml)
    # and the job result is the check.
    permissions:
      contents: read
      packages: read # pull the MegaLinter image from ghcr.io

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No credential in .git/config: Prettier imports code from the
          # node_modules this PR installed, which --ignore-scripts does not
          # stop, and nothing in this job pushes.
          persist-credentials: false
          # Full history: with VALIDATE_ALL_CODEBASE false, MegaLinter diffs
          # against the base branch.
          fetch-depth: 0

      # Without this the install runs on whatever Node the runner ships rather
      # than the version this project targets, and a different npm resolves the
      # lockfile differently — that mismatch failed `npm ci` here while the
      # identical command passed in ci.yml.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        # --ignore-scripts: this job installs PR-authored dependency manifests;
        # linting needs no lifecycle scripts.
        run: npm ci --ignore-scripts

      - name: MegaLinter
        uses: oxsecurity/megalinter@f2fe8c1cba37091848df3e524066c8c23ef353ed # v10.2.0
        env:
          # Lints only the files a pull request changes. This workflow runs on
          # pull_request alone, so an expression switching to the whole
          # codebase on a push to main could never be true.
          VALIDATE_ALL_CODEBASE: false
          # No GITHUB_TOKEN: this container runs PR-installed code. The GitHub
          # status and comment reporters that need one are off in
          # .mega-linter.yml.

      - name: Upload MegaLinter reports
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log
