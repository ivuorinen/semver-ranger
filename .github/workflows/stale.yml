---
name: Stale

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  stale:
    name: Stale
    runs-on: ubuntu-latest
    permissions:
      contents: read # read repository metadata to evaluate staleness
      issues: write # comment on and close stale issues
      pull-requests: write # comment on and close stale pull requests
    steps:
      - uses: ivuorinen/actions/stale@6a8c40d9c5ff01b901d382b0ef86d432215aae2a # v2026.09.09
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
