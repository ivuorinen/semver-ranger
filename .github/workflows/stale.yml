---
name: Stale

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: ivuorinen/actions/stale@de31e11dda6488eabe95e951ebb61c6d9d500865 # v2026.06.30
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
