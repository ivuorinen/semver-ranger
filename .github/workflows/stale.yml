---
name: Stale

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: ivuorinen/actions/stale@133e70a949f087aca68c8ab71b095421f1519496 # v2026.07.24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
