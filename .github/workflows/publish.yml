---
name: Publish

on:
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # A reusable-workflow call cannot be granted more than the caller holds,
    # and the workflow-level block is empty, so state it here.
    permissions:
      contents: read

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [ci]

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # semantic-release does not use the persisted credentials: when a
          # plain push fails it builds https://x-access-token:$GITHUB_TOKEN@...
          # itself (semantic-release/lib/get-git-auth-url.js), and the runner
          # always sets GITHUB_ACTION, which that lookup requires.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          always-auth: true
          registry-url: 'https://registry.npmjs.org'
          scope: '@ivuorinen'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/package-lock.json') }}

      - run: npm ci --ignore-scripts

      - run: npm run build

      - uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
