---
name: Publish

on:
  push:
    branches: [main]

permissions: {}

# Serialise releases: two concurrent runs would compute the same next version
# and race on the tag push and the npm publish. Never cancel a release mid-flight.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    # A reusable-workflow call cannot be granted more than the caller holds,
    # and the workflow-level block is empty, so state it here.
    permissions:
      contents: read

  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci]

    permissions:
      contents: write # semantic-release pushes the release tag and creates the GitHub release
      issues: write # semantic-release comments on released issues
      pull-requests: write # semantic-release comments on released PRs
      id-token: write # OIDC for npm trusted publishing and provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # semantic-release does not use the persisted credentials: when a
          # plain push fails it builds https://x-access-token:$GITHUB_TOKEN@...
          # itself (semantic-release/lib/get-git-auth-url.js), and the runner
          # always sets GITHUB_ACTION, which that lookup requires.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          # No always-auth: publishing uses npm trusted publishing via the
          # job's id-token permission, not a stored credential. Confirmed on
          # the registry — releases are attributed to
          # "GitHub Actions <npm-oidc-no-reply@github.com>" and carry
          # provenance attestations, and no NPM_TOKEN exists in this repo.
          registry-url: 'https://registry.npmjs.org'
          scope: '@ivuorinen'
          # Caches ~/.npm. A node_modules cache is useless here: npm ci deletes
          # node_modules before installing.
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run build

      # @semantic-release/npm publishes with this Node's npm: package.json
      # overrides the project's own copy away, because the advisories bundled
      # inside it cannot be overridden. Trusted publishing needs npm >= 11.5.1.
      # The locked semantic-release from npm ci runs here; a release action
      # would install an unlocked latest one in this job that can publish.
      - run: npm exec --no -- semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
